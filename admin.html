<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DANTE Admin</title>
<style>body{font-family:Arial;background:#f4f4f4;margin:0;padding:20px}.box{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:12px}input,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}button{padding:10px 16px;border:none;border-radius:8px;cursor:pointer}button.orange{background:#ff7a00;color:#fff}button.red{background:#e74c3c;color:#fff}.card{border:1px solid #eee;border-radius:12px;padding:12px;margin:10px 0;display:flex;gap:10px;align-items:center}.card img{width:60px;height:60px;object-fit:cover;border-radius:8px}#loginError{color:red;font-size:13px;display:none}</style>
</head><body><div class="box">
<div id="loginPage"><h1>DANTE ELECTRONICS</h1><p>Admin Login Only</p><h2>🔒 Admin Login</h2><input type="password" id="pin" placeholder="Enter Admin PIN"><p id="loginError">Wrong PIN. Try again.</p><button class="orange" onclick="login()">Login</button><p style="text-align:center"><a href="index.html">← Back to Shop</a></p></div>
<div id="dashboard" style="display:none"><h1>DANTE Admin</h1><p><a href="#" onclick="logout()">Logout</a></p><h2>Add New Product</h2><input id="pName" placeholder="Product Name"><input id="pPrice" type="number" placeholder="Price Ksh"><select id="pCat"><option>Phones</option><option>Accessories</option><option>Audio</option><option>Power</option><option>Home</option><option>Computing</option><option>Gaming</option></select><input id="pBrand" placeholder="Brand"><input id="pImg" placeholder="Image Link / Photo URL"><input id="pStock" type="number" placeholder="Stock"><button class="orange" onclick="addProduct()">+ Add Product</button><h2>Products (<span id="count">0</span>)</h2><div id="list"></div><button style="background:#eee;color:#333" onclick="window.location.href='index.html'">View Shop →</button></div>
</div>
<script>
var ADMIN_PIN="2477";
function login(){if(document.getElementById("pin").value===ADMIN_PIN){localStorage.setItem("dante_admin","yes");showDashboard();}else{document.getElementById("loginError").style.display="block";}}
function logout(){localStorage.removeItem("dante_admin");document.getElementById("dashboard").style.display="none";document.getElementById("loginPage").style.display="block";}
function showDashboard(){document.getElementById("loginPage").style.display="none";document.getElementById("dashboard").style.display="block";renderList();}
function getProducts(){var s=localStorage.getItem("dante_products");return s?JSON.parse(s):[]}
function saveProducts(p){localStorage.setItem("dante_products",JSON.stringify(p))}
function addProduct(){var name=document.getElementById("pName").value;var price=Number(document.getElementById("pPrice").value);var cat=document.getElementById("pCat").value;var brand=document.getElementById("pBrand").value;var img=document.getElementById("pImg").value;var stock=document.getElementById("pStock").value;if(!name||!price){alert("Weka Jina na Bei");return}var list=getProducts();list.push({name:name,price:price,cat:cat,brand:brand,img:img,stock:stock});saveProducts(list);document.getElementById("pName").value="";document.getElementById("pPrice").value="";document.getElementById("pImg").value="";renderList();alert("Product Added!");}
function renderList(){var list=getProducts();document.getElementById("count").textContent=list.length;var h="";list.forEach(function(p,i){h+='<div class="card">'+(p.img?'<img src="'+p.img+'">':'')+'<div style="flex:1"><b>'+p.name+'</b><br>Ksh '+p.price+' - '+p.cat+'</div><button class="red" onclick="delProduct('+i+')">Delete</button></div>';});document.getElementById("list").innerHTML=h||"<p>Hakuna bidhaa bado</p>";}
function delProduct(i){if(confirm("Delete hii?")){var l=getProducts();l.splice(i,1);saveProducts(l);renderList();}}
if(localStorage.getItem("dante_admin")==="yes"){showDashboard();}
</script></body></html>
