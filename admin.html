<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>DANTE Admin</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{background:#f4f4f4;padding:20px}.box{background:#fff;max-width:480px;margin:0 auto;padding:20px;border-radius:16px}h1{font-size:22px;color:#ff6b00}h2{font-size:19px;margin:18px 0 12px}p{font-size:13px;color:#666;margin:6px 0 14px}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:7px 0;font-size:15px}button{width:100%;padding:13px;border:none;border-radius:12px;background:#0a8a2f;color:#fff;font-weight:bold;font-size:16px;cursor:pointer;margin-top:8px}button.orange{background:#ff7a00}button.red{background:#e74c3c;padding:8px;font-size:13px;width:auto}.card{border:1px solid #eee;border-radius:12px;padding:12px;margin:10px 0;display:flex;gap:10px;align-items:center}.card img{width:60px;height:60px;object-fit:cover;border-radius:8px}#dashboard{display:none}#loginError{color:red;font-size:13px;display:none}</style>
</head><body><div class="box">
<div id="loginPage"><h1>DANTE ELECTRONICS</h1><p>Admin Login Only</p><h2>🔐 Admin Login</h2><input type="password" id="pin" placeholder="Enter Admin PIN"><p id="loginError">Wrong PIN. Try again.</p><button onclick="login()">Login</button><p style="text-align:center;margin-top:12px">Demo PIN: <b>1234</b></p><p style="text-align:center"><a href="index.html">← Back to Shop</a></p></div>
<div id="dashboard"><h1>DANTE Admin</h1><p><a href="#" onclick="logout()">Logout</a></p><h2>Add New Product</h2><input id="pName" placeholder="Product Name"><input id="pPrice" type="number" placeholder="Price Ksh"><select id="pCat"><option>Phones</option><option>Accessories</option><option>Audio</option><option>Power</option><option>Home</option><option>Computing</option><option>Gaming</option></select><input id="pBrand" placeholder="Brand"><input id="pImg" placeholder="Image Link / Photo URL"><input id="pStock" type="number" placeholder="Stock"><button class="orange" onclick="addProduct()">+ Add Product</button><h2>Products (<span id="count">0</span>)</h2><div id="list"></div><button style="background:#eee;color:#333" onclick="window.location.href='index.html'">View Shop →</button></div>
</div>
<script>
var ADMIN_PIN="1234";
function login(){if(document.getElementById('pin').value===ADMIN_PIN){localStorage.setItem('dante_admin','yes');showDashboard();}else{document.getElementById('loginError').style.display='block';}}
function logout(){localStorage.removeItem('dante_admin');document.getElementById('dashboard').style.display='none';document.getElementById('loginPage').style.display='block';}
function showDashboard(){document.getElementById('loginPage').style.display='none';document.getElementById('dashboard').style.display='block';renderList();}
function getProducts(){var s=localStorage.getItem('dante_products');return s?JSON.parse(s):[];}
function saveProducts(l){localStorage.setItem('dante_products',JSON.stringify(l));}
function addProduct(){var name=document.getElementById('pName').value.trim();var price=Number(document.getElementById('pPrice').value);if(!name||!price){alert('Weka Name na Price');return;}var list=getProducts();list.push({id:Date.now(),name:name,price:price,cat:document.getElementById('pCat').value,brand:document.getElementById('pBrand').value||'Dante',img:document.getElementById('pImg').value||'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400',stock:Number(document.getElementById('pStock').value)||0});saveProducts(list);alert(name+' Added!');renderList();}
function deleteProduct(id){if(!confirm('Delete?'))return;saveProducts(getProducts().filter(function(p){return p.id!==id}));renderList();}
function renderList(){var list=getProducts();document.getElementById('count').innerText=list.length;document.getElementById('list').innerHTML=list.length===0?'<p>No admin products yet.</p>':list.map(function(p){return '<div class="card"><img src="'+p.img+'"><div style="flex:1"><b>'+p.name+'</b><br><span>'+p.brand+' • '+p.cat+' • KSh '+p.price.toLocaleString()+' • Stock: '+p.stock+'</span></div><button class="red" onclick="deleteProduct('+p.id+')">Delete</button></div>';}).join('');}
if(localStorage.getItem('dante_admin')==='yes'){showDashboard();}
</script></body></html>
